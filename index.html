<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pengimbas Resit AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      overflow: hidden;
      padding: 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 22px;
      color: #1976d2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header p {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    .config-box {
      background: #f8f9fa;
      border: 1px dashed #cfd8dc;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 12px;
    }
    .config-box label {
      font-weight: 600;
      color: #455a64;
      display: block;
      margin-bottom: 4px;
    }
    .config-box input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccd0d5;
      border-radius: 6px;
      font-size: 12px;
    }
    .upload-zone {
      border: 2px dashed #90caf9;
      background: #f4f9ff;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-zone:active {
      background: #e3f2fd;
      border-color: #1976d2;
    }
    .upload-zone svg {
      width: 48px;
      height: 48px;
      fill: #1976d2;
      margin-bottom: 8px;
    }
    .upload-zone p {
      font-size: 14px;
      font-weight: 600;
      color: #1976d2;
    }
    .upload-zone span {
      font-size: 12px;
      color: #78909c;
    }
    #preview-container {
      margin-top: 18px;
      display: none;
      text-align: center;
    }
    #preview {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      border: 1px solid #ddd;
      object-fit: contain;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary { background: #2e7d32; color: #fff; }
    .btn-primary:active { background: #1b5e20; }
    .btn-secondary { background: #546e7a; color: #fff; }
    .btn-secondary:active { background: #37474f; }
    .status-msg {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
      color: #0277bd;
    }
    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #0277bd;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-card {
      margin-top: 20px;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 16px;
      display: none;
    }
    .result-card h3 {
      font-size: 15px;
      color: #263238;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .info-label { color: #607d8b; }
    .info-val { font-weight: 600; color: #212121; text-align: right; }
    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    .items-table th, .items-table td {
      padding: 6px 4px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .items-table th { background: #f0f0f0; color: #455a64; }
    .items-table td.num { text-align: right; }
    .total-highlight {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 2px dashed #b0bec5;
      font-size: 15px;
      font-weight: 700;
      color: #d32f2f;
      display: flex;
      justify-content: space-between;
    }
    pre {
      background: #263238;
      color: #cfd8dc;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      overflow-x: auto;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>📄 ResitAI Scanner</h1>
    <p>Tangkap gambar resit, tukar ke PDF & ekstrak teks AI</p>
  </div>

  <div class="config-box">
    <label for="backendUrl">Pautan Backend Cloud Run (API):</label>
    <input type="text" id="backendUrl" placeholder="https://resit-api-xxxx-as.a.run.app">
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
  
  <div class="upload-zone" onclick="document.getElementById('cameraInput').click()">
    <svg viewBox="0 0 24 24">
      <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
    </svg>
    <p>Ambil Gambar Resit</p>
    <span>Kamera telefon atau pilih fail galeri</span>
  </div>

  <div id="preview-container">
    <img id="preview" alt="Pratonton Resit">
  </div>

  <div class="btn-group" id="actions" style="display: none;">
    <button class="btn btn-primary" id="processBtn" onclick="processReceipt()">
      ⚡ Jana PDF & Ekstrak Data AI
    </button>
    <button class="btn btn-secondary" onclick="downloadPdfDirectly()">
      💾 Muat Turun Fail PDF Sahaja
    </button>
  </div>

  <div id="status" class="status-msg"></div>

  <div class="result-card" id="resultCard">
    <h3>Hasil Ekstrak AI (Gemini)</h3>
    <div class="info-row">
      <span class="info-label">Nama Kedai:</span>
      <span class="info-val" id="resKedai">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">Tarikh:</span>
      <span class="info-val" id="resTarikh">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">No. Resit:</span>
      <span class="info-val" id="resNo">-</span>
    </div>

    <table class="items-table" id="itemsTable">
      <thead>
        <tr>
          <th>Barang / Item</th>
          <th style="text-align: right;">Harga (RM)</th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <div class="total-highlight">
      <span>JUMLAH:</span>
      <span id="resTotal">RM 0.00</span>
    </div>

    <button style="margin-top: 10px; background: none; border: none; color: #1976d2; font-size: 11px; cursor: pointer; text-decoration: underline;" onclick="toggleRawJson()">
      Lihat Format Mentah (JSON)
    </button>
    <pre id="rawJson"></pre>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
